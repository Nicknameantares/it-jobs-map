name: Обновить вакансии
on:
  schedule:
    - cron: "17 3 * * *"   # каждый день в 06:17 по Москве
  workflow_dispatch:
  push:
    paths: ["tools/collect.py",".github/workflows/collect.yml"]
permissions:
  contents: write
concurrency: { group: collect, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python tools/collect.py
      - run: |
          git config user.name "vacancy-bot"; git config user.email "vacancy-bot@users.noreply.github.com"
          git add data && git commit -m "Обновление вакансий $(date -u +%Y-%m-%d) [skip ci]" && git pull --rebase && git push || echo "no changes"
