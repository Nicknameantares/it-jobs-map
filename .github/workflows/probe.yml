name: probe
on:
  push:
    paths: ["tools/probe_urls.txt","tools/probe.py",".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe.py
      - run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add probe && git commit -m "probe results [skip ci]" && git push || true
