name: probe
on:
  push:
    paths: ["tools/probe2.py",".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python tools/probe2.py
      - run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add probe2 && git commit -m "probe2 results [skip ci]" && git push || true
