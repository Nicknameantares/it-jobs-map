name: probe
on:
  push:
    paths: ["tools/probe3.py",".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python tools/probe3.py
      - run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add probe3 && git commit -m "probe3 [skip ci]" && git pull --rebase && git push || true
